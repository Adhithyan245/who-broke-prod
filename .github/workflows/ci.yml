name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8" "ruff>=0.6"
      - run: ruff check .
      - run: python -m pytest -q
      - name: static bundle is fresh (web/data matches a rebuild)
        run: python -m whobrokeprod.presentation.build_static --check
