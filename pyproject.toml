[project]
name = "whobrokeprod"
version = "0.2.0"
description = "WHO BROKE PROD? Deterministic multi-agent incident-investigation simulator, API and web demo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # runtime is the Python standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
whobrokeprod = "whobrokeprod.presentation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whobrokeprod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
